# Turbofan engine degradation dataset for le-wm training.
#
# PREREQUISITES — run once in rl_simulator_safran/:
#
#   python hpc/prepare_lewm_dataset.py \
#       --input  data/opendeck_2000.h5 \
#       --output data/opendeck_2000_lewm.h5
#
# TRAINING — from le-wm/:
#
#   python train.py \
#       data=turbofan \
#       data.dataset.cache_dir=/abs/path/to/rl_simulator_safran/data
#
# The file loaded will be: {cache_dir}/opendeck_2000_lewm.h5
# Alternatively, set STABLEWM_HOME to the data dir and drop cache_dir.
#
# ENCODER NOTES:
#   • encoder_type=sensor (default on this branch):
#     Loads observation.sensors (28 float values = 4 contexts × 7 sensor channels).
#     z-normalised at runtime — no image preprocessing required.
#
#   • encoder_type=vit (legacy comparison):
#     Override keys_to_load to [pixels, action] and set encoder_type=vit via CLI:
#       python train.py data=turbofan encoder_type=vit \
#           "data.dataset.keys_to_load=[pixels,action]"
#     img_size=28, patch_size=7  →  16 patches (fast).
#
# frameskip=1: turbofan degrades slowly, consecutive steps are informative.
# action is discrete {0: do nothing, 1: repair}. Z-normalised at runtime.

dataset:
  # With obs_window_size=w the encoder needs w-1 extra frames to build
  # sliding windows.  Total frames per sample: history + preds + (w - 1).
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size} + ${obs_window_size} - 1'}
  frameskip: 1
  name: opendeck_2000_lewm
  cache_dir: /lustre/fswork/projects/rech/yil/ugy35qd/thesis/rl_opendeck_simulator/data
  keys_to_load:
    - observation.sensors  # raw sensor vector (28 values = 4 contexts × 7 channels)
    - action               # discrete {0: nothing, 1: repair} — z-normalised at runtime
  keys_to_cache:
    - action
    - observation.sensors

# NOTE: hi_probe config lives in lewm.yaml (top-level), not here,
# because Hydra loads this file under cfg.data.* and train.py reads
# hi_probe from the top-level cfg
