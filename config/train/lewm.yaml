defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: thil-ecole-polytechnique
    project: turbofan
    name: ${output_model_name}
    #id: ${subdir}
    resume: never
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 64 #192

predictor:
  depth: 4 #6
  heads: 8 #16
  mlp_dim: 512 #2048
  dim_head: 32 #64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# ── Downstream HI probe ──────────────────────────────────────────────────────
# Trains an MLP every eval_interval epochs to predict HI states from JEPA
# encoder embeddings. Requires 'observation.state' in the HDF5 (always present).
# Set enabled: false to skip (saves ~30-60s per eval_interval epochs).
hi_probe:
  enabled: false          # override to true via CLI: hi_probe.enabled=true
  eval_interval: 5        # run probe every N epochs
  n_probe_epochs: 100     # MLP probe training epochs
  hidden_dim: 256         # probe hidden layer width
  n_subsample: 30000      # max timesteps to encode per split (speed/memory)
