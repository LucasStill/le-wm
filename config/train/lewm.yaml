defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 28
patch_size: 7    # 28/7 = 16 patches (was patch_size=14 -> 4 patches, too coarse)

# ── Encoder input window ───────────────────────────────────────────────────────
# A single observation o_t has shape (4 contexts) x (7 sensors) = 28 values.
# The 4 contexts are flight phases (takeoff, climb1, climb2, cruise) describing
# the same degradation state — they are NOT consecutive timesteps.
#
# obs_window_size=1 (default): encoder sees only o_t -> pure snapshot encoder.
# obs_window_size=w: encoder sees [o_{t-w+1}, ..., o_t], i.e. w*(4*7)=w*28 values.
#   This gives the encoder genuine temporal depth: it can encode degradation rate,
#   trend direction, and time-since-last-maintenance alongside the current state.
#   The ViT / sensor-native transformer input must be adapted accordingly.
#
# Compare e.g. w=1 (baseline), w=5, w=10.
# Note: probe_seq_len is a DOWNSTREAM-only parameter (probe head temporal context).
#       obs_window_size is an ENCODER-level parameter (architecture change).
obs_window_size: 1   # 1 = snapshot encoder; >1 = TemporalAggregator active
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: 16-mixed  # bf16 can overflow silently on sigreg ops; fp16 has more headroom
  gradient_clip_val: 0.3  # epoch 7-8 instability: tighter clipping for early stability

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 7e-5    # lowered from 1e-4: cosine schedule starts ~flat so early epochs
              # are unprotected; 7e-5 prevents overstepping the sigreg basin
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: thil-ecole-polytechnique
    project: turbofan
    name: ${output_model_name}
    #id: ${subdir}
    resume: never
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 64 #192

predictor:
  depth: 4 #6
  heads: 8 #16
  mlp_dim: 512 #2048
  dim_head: 32 #64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.15  # 0.09 plateaued, 0.5 diverged — calibrated middle ground
    kwargs:
      knots: 17
      num_proj: 1024

# ── Downstream HI probe ──────────────────────────────────────────────────────
# Trains a TransformerProbe every eval_interval epochs to predict HI states
# from frozen JEPA encoder embeddings.
# Enable via CLI: hi_probe.enabled=true data.dataset.cache_dir=/path/to/data
#
# Two useful configurations to compare:
#   seq_len=1  (default): single-snapshot probe — each input is one embedding.
#              Self-attention is trivial; equivalent to an MLP. Fast.
#   seq_len=10: trajectory-window probe — each input is 10 consecutive
#              embeddings from the same episode. The transformer attends over
#              the window. Requires whole-episode gathering (slower setup).
#
# Launch two parallel runs to compare:
#   python train.py ... hi_probe.enabled=true hi_probe.probe_seq_len=1
#   python train.py ... hi_probe.enabled=true hi_probe.probe_seq_len=10
hi_probe:
  enabled: false          # override via CLI: hi_probe.enabled=true
  eval_interval: 5        # run probe every N training epochs
  n_probe_epochs: 150     # was 50 — more epochs to reach stable convergence
  probe_lr: 1e-3          # Adam lr for the probe
  probe_patience: 20      # was 10 — more patience before early stop
  d_model: 64             # transformer hidden dim (64 = embed_dim, avoids bottleneck)
  nhead: 4                # attention heads (d_model must be divisible by nhead)
  num_layers: 2           # transformer encoder layers
  probe_dropout: 0.1      # dropout in transformer + output head
  probe_batch_size: 256   # batch size for probe training
  probe_seq_len: 1        # 1 = single-step; >1 = temporal window (episode-aware)
  n_subsample: 30000      # max timesteps per split (for seq_len>1: whole episodes)
  enc_batch_size: 2048    # JEPA encoding batch size
  rul_max_horizon: 300    # cap (steps) for Action-RUL probe; 0 = disabled
