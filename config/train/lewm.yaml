defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 0
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: False
  prefetch_factor: null
  pin_memory: False

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

scheduler:
  warmup_steps: 500
  max_steps: 80000

wandb:
  enabled: False
  config:
    entity: thil-ecole-polytechnique
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 256 #1024

  # STEP temporal triplet loss.
  # Set weight > 0 to enable (also activates TemporalMetadataWrapper).
  # margin lives in cosine-similarity space [-1, 1]; 0.5 is a safe start.
  #
  # Margin design (mirrors STEP's health_margin / margin):
  #
  #   |Δepisode_pos| < pos_radius                  → positive pair
  #   |Δepisode_pos| > pos_radius + neg_gap         → negative pair
  #   (dead zone in between, pairs are ignored)
  #
  # episode_pos is normalised to [0, 1] so these values are fractions of
  # the episode length — no need to tune per-dataset based on episode length.
  #
  # Additionally, any cross-episode pair is always treated as a negative,
  # guaranteeing that negatives are available even in batches where few
  # sequences share the same episode.
  temporal_triplet:
    weight: 0.05      # λ_step  —  set to 0.0 to disable
    margin: 0.5       # cosine triplet margin
    pos_radius: 0.10  # max |Δpos| to be a positive (within ~10 % of episode)
    neg_gap: 0.10     # dead-zone width beyond pos_radius before negatives start
