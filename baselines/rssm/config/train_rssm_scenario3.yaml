# DreamerV3 RSSM baseline on TurboSens1 (scenario 3 in code).
# Same defaults as turbosens2 except n_sensors and num_actions.

defaults:
  - _self_

output_model_name: rssm_s3
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072

data:
  dataset:
    num_steps: 64
    frameskip: 1
    name: turbosens1_train
    cache_dir: /home/lucas/.stable_worldmodel
    keys_to_load:
      - pixels
      - action
    keys_to_cache:
      - action
      - pixels

n_sensors: 84                           # 7 channels x 12 contexts (no env params)
num_actions: 6                          # 0=do_nothing .. 5=targeted_patch (no wash)

rssm:
  embed_size:     512
  encoder_hidden: 512
  decoder_hidden: 512
  encoder_layers: 2
  decoder_layers: 2
  symlog_inputs:  true
  stoch:    32
  discrete: 32
  deter:    512
  hidden:   512
  unimix_ratio: 0.01
  norm: true

loss:
  kl_free:   1.0
  dyn_scale: 0.5
  rep_scale: 0.1

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 0.3

loader:
  batch_size: 16
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: thil-ecole-polytechnique
    project: turbofan_S3
    name: ${output_model_name}
    resume: never
    log_model: False

hi_probe:
  enabled: false
  eval_interval: 5
  n_probe_epochs: 150
  probe_lr: 1e-3
  probe_patience: 20
  d_model: 128
  nhead: 4
  num_layers: 3
  probe_dropout: 0.1
  probe_batch_size: 256
  probe_seq_len: 1
  n_subsample: 200000
  enc_batch_size: 2048
  rul_max_horizon: 300

img_size: 28
