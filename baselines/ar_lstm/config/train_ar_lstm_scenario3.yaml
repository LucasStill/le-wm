defaults:
  - _self_
  # Scenario-3 variant of the AR-LSTM baseline.
  # Key difference from train_ar_lstm.yaml: n_sensors=84 and turbosens1 data.

output_model_name: ar_lstm_s3
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072

# ── Data ─────────────────────────────────────────────────────────────────────
# Points at turbosens1_train.h5.
# Prerequisite: run prepare_scenario3_dataset.py --all_splits first.
data:
  dataset:
    num_steps: ${eval:'${wm.history_size} * ${wm.h_step} + ${obs_window_size}'}
    frameskip: 1
    name: turbosens1_train
    cache_dir: /lustre/fswork/projects/rech/yil/ugy35qd/.stable_worldmodel
    keys_to_load:
      - pixels   # (N, 7, 12) normalised sensor data
      - action   # scalar float32, values 0–4 — z-normalised at runtime
    keys_to_cache:
      - action   # pixels NOT cached here — copy HDF5 to $SCRATCH in SLURM instead (faster)

# ── Encoder ──────────────────────────────────────────────────────────────────
# n_sensors = 84 = 7 sensors × 12 flight-phase contexts (turbosens1)
# The SensorEncoder flattens pixels (B, T, 7, 12) → (B, T, 84) automatically.
encoder_type: sensor
n_sensors: 84
img_size: 28          # kept for HIProbeCallback compat; unused by sensor encoder

sensor_encoder:
  d_model: 64         # must equal wm.embed_dim to avoid projection bottleneck
  nhead: 4
  num_layers: 2
  dropout: 0.1

obs_window_size: 1    # 1 = snapshot encoder

# ── World model ───────────────────────────────────────────────────────────────
wm:
  type: ar_lstm
  history_size: 3     # context window fed to the LSTM
  h_step: 1           # stride between history latents; 1 = dense (original)
  num_preds: 1
  embed_dim: 64
  zero_pad_prob: 0.0  # prob of randomly zeroing a prefix of the context window each batch

# ── LSTM predictor ────────────────────────────────────────────────────────────
lstm:
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1

# ── Training ──────────────────────────────────────────────────────────────────
trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: 16-mixed
  gradient_clip_val: 0.3

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 7e-5
  weight_decay: 1e-3

loss:
  sigreg:
    weight: 0.15
    kwargs:
      knots: 17
      num_proj: 1024

wandb:
  enabled: True
  config:
    entity: thil-ecole-polytechnique
    project: turbosens1
    name: ${output_model_name}
    resume: never
    log_model: False

hi_probe:
  enabled: false
  eval_interval: 5
  n_probe_epochs: 150
  probe_lr: 1e-3
  probe_patience: 20
  d_model: 64
  nhead: 4
  num_layers: 2
  probe_dropout: 0.1
  probe_batch_size: 256
  probe_seq_len: 1
  n_subsample: 30000
  enc_batch_size: 2048
  rul_max_horizon: 300
